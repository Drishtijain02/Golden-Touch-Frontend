<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Owner Login | Golden Touch Beauty Salon &amp; Parlour</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--teal:#0B0B0B;--teal-l:#111111;--teal-m:#D4AF37;--cream:#F8F5EF;--cream-d:#E8DCC4}
html{scroll-behavior:smooth}
body{font-family:'Poppins',sans-serif;background:#0B0B0B;color:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg-pattern{position:fixed;inset:0;opacity:.03;background-image:repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(248,245,239,.5) 40px,rgba(248,245,239,.5) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(248,245,239,.5) 40px,rgba(248,245,239,.5) 41px);pointer-events:none;z-index:0}
.bg-orb{position:fixed;width:min(500px,90vw);height:min(500px,90vw);border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0}
.login-card{position:relative;z-index:1;background:#111111;border:1px solid rgba(248,245,239,.08);padding:48px 40px;width:100%;max-width:380px;margin:16px;animation:cardIn .7s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.brand{text-align:center;margin-bottom:36px}
.brand-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid rgba(248,245,239,.15);margin-bottom:14px}
.brand-name{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--cream);letter-spacing:4px}
.brand-name span{color:var(--teal-m);font-style:italic}
.brand-sub{font-size:.58rem;letter-spacing:3px;text-transform:uppercase;color:rgba(248,245,239,.25);margin-top:6px}
.divln{width:44px;height:1px;background:rgba(248,245,239,.12);margin:0 auto 32px}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:rgba(248,245,239,.35);margin-bottom:6px}
.fg input{width:100%;background:rgba(17,17,17,.42);border:1px solid rgba(248,245,239,.09);color:var(--cream);padding:13px 16px;font-family:'Poppins',sans-serif;font-size:.82rem;outline:none;transition:border-color .3s;font-weight:300}
.fg input:focus{border-color:rgba(248,245,239,.26)}
.fg input::placeholder{color:rgba(248,245,239,.18)}
.login-btn {
  width:100%;
  padding:14px;
  background:var(--cream);
  color:#0a2a2b; /* darker for visibility */
}
.login-btn:hover{
  background:var(--cream-d);
  transform:translateY(-1px);
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}
.login-btn:disabled{opacity:.4;cursor:not-allowed}
.err-msg{color:#e74c3c;font-size:.7rem;margin-top:12px;text-align:center;display:none;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.back-link{display:block;text-align:center;margin-top:24px;font-size:.62rem;letter-spacing:2px;text-transform:uppercase;color:rgba(248,245,239,.2);text-decoration:none;transition:color .3s}
.back-link:hover{color:rgba(248,245,239,.5)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(248,245,239,.1);border-radius:2px}
</style>
</head>
<body>

<div class="bg-pattern"></div>
<div class="bg-orb"></div>

<div class="login-card">
  <div class="brand">
    <img class="brand-logo" src="img/logo.png" alt="Golden Touch Logo" onerror="this.style.display='none'"/>
    <div class="brand-name">Golden Touch<span>.</span></div>
    <div class="brand-sub">Owner Access</div>
  </div>
  <div class="divln"></div>

<div class="fg">
  <label>Email</label>
  <input
    type="email"
    id="email"
    placeholder="Enter email"
    onkeydown="if(event.key==='Enter')login()"
  />
</div>

<div class="fg">
  <label>Password</label>
  <div style="position:relative">
  <input type="password" id="password" placeholder="Enter password"
         onkeydown="if(event.key==='Enter')login()"
         style="width:100%;padding-right:40px"/>

  <span onclick="togglePassword()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:14px;color:rgba(248,245,239,.5)"><i class="fa-solid fa-eye"></i></span>
</div>
</div>
  <button class="login-btn" id="login-btn" onclick="login()"><i class="fa-solid fa-arrow-right"></i> Sign In</button>
  <p class="err-msg" id="err-msg">Incorrect password. Please try again.</p>
  <a class="back-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Golden Touch Beauty Salon &amp; Parlour</a>
</div>

<script>
const API_BASE = "https://golden-touch-backend.onrender.com/api";

// Redirect if already logged in
if (localStorage.getItem("ownerAuth") === "true") {
    window.location.href = "dashboard.html";
}

async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter email and password.");
        return;
    }

    try {

        const res = await fetch(API_BASE + "/auth/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email,
                password
            })

        });

        const data = await res.json();

        console.log(data);

        if (!res.ok) {

            alert(data.error || "Login failed.");

            return;

        }

        localStorage.setItem("ownerAuth", "true");

        localStorage.setItem("ownerName", data.user.full_name);

        localStorage.setItem("ownerEmail", data.user.email);

        window.location.href = "dashboard.html";

    }

    catch (err) {

        console.error(err);

        alert("Server error.");

    }

}

function togglePassword() {

    const input = document.getElementById("password");

    input.type =
        input.type === "password"
            ? "text"
            : "password";

}
</script>
</body>
</html>
